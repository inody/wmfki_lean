name = "wmfki_formalization"
version = "0.1.0"
defaultTargets = ["Lean_Code", "Showcase", "WMFKI_Stochastic"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[require]]
name = "stochasticAnalysis"
git = "https://github.com/MasaakiFukasawa/stochastic-analysis-lean.git"
rev = "0cb33378176178d269f53a4dada439f8ecd3bf5e"

[[lean_lib]]
name = "Lean_Code"
globs = ["Lean_Code.+"]

[[lean_lib]]
name = "Showcase"

[[lean_lib]]
name = "WMFKI_Stochastic"
globs = ["WMFKI_Stochastic.+"]
